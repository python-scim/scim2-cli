[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "scim2-cli"
version = "0.4.0"
description = "SCIM application development CLI"
authors = [{name="Yaal Coop", email="contact@yaal.coop"}]
license = {file = "LICENSE.md"}
readme = "README.md"
keywords = ["scim", "scim2", "provisioning", "rfc7643", "rfc7644"]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: Apache Software License",
    "Environment :: Web Environment",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
]

requires-python = ">= 3.11"
dependencies = [
    "click>=8.1.7",
    "scim2-client[httpx2]>=0.11.2",
    "scim2-tester>=0.4.0",
    "sphinx-click-rst-to-ansi-formatter>=0.2.0",
    "pydanclick>=0.5.0",
    "pygments>=2.18.0",
]

[project.urls]
documentation = "https://scim2-cli.readthedocs.io"
repository = "https://github.com/python-scim/scim2-cli"
changelog = "https://scim2-cli.readthedocs.io/en/latest/changelog.html"
funding = "https://github.com/sponsors/python-scim"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "prek>=0.1.0",
    "pytest>=8.2.1",
    "pytest-cov>=6.0.0",
    "pytest-httpserver>=1.0.10",
    "tox-uv>=1.16.0",
]
doc = [
    "myst-parser>=3.0.1",
    "shibuya>=2024.5.15",
    "sphinx>=7.3.7",
    "sphinx-click>=6.0.0",
    "sphinx-design>=0.6.0",
    "sphinx-iconify>=0.0.6",
    "sphinx-issues>=5.0.0",
    "sphinx-substitution-extensions>=2024.8.6",
]
bundle = [
    "pyinstaller>=6.10.0",
]

[project.scripts]
scim = "scim2_cli:cli"
scim2 = "scim2_cli:cli"

[tool.uv]
exclude-newer = "14 days"
# TODO: remove sphinx-click-rst-to-ansi-formatter after 2026-10-20, when 0.2.0 is older than 14 days.
exclude-newer-package = { scim2-models = false, scim2-client = false, scim2-server = false, scim2-cli = false, scim2-tester = false, pytest-scim2-server = false, sphinx-click-rst-to-ansi-formatter = false }

[tool.uv.build-backend]
module-root = ""

[tool.coverage.run]
source = [
    "scim2_cli",
    "tests",
]
omit = [".tox/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "@pytest.mark.skip",
    "pragma: no cover",
    "raise NotImplementedError",
    "except ImportError",
    "if app.debug",
    "if TYPE_CHECKING:",
]

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # line-too-long
    "E722", # bare-except
    "D100", # public module
    "D101", # public class
    "D102", # public method
    "D103", # public function
    "D104", # public package
    "D105", # magic method
    "D106", # nested class
    "D107", # public init
    "D203", # no-blank-line-before-class
    "D213", # multi-line-summary-second-line
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
docstring-code-format = true

[tool.codespell]
ignore-words-list = "datas"

[tool.mypy]
plugins = [
  "pydantic.mypy"
]
files = ["scim2_cli"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.tox]
requires = ["tox>=4.19"]
env_list = [
    "style",
    "py311",
    "py312",
    "py313",
    "py314",
    "minversions",
    "doc",
    "bundle",
    "coverage",
]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [
    ["pytest", "--showlocals", "--full-trace", "{posargs}"],
]

[tool.tox.env.style]
runner = "uv-venv-runner"
commands = [
    ["prek", "run", "--all-files", "--show-diff-on-failure"],
]

[tool.tox.env.minversions]
runner = "uv-venv-runner"
uv_resolution = "lowest-direct"

[tool.tox.env.doc]
dependency_groups = ["doc"]
commands = [
    ["sphinx-build", "-W", "--keep-going", "--builder", "html", "doc", "build/sphinx/html"],
    ["sphinx-build", "-W", "--keep-going", "--builder", "man", "doc", "build/sphinx/html"],
]

[tool.tox.env.coverage]
commands = [
    ["pytest", "--cov", "--cov-fail-under=100", "--cov-report", "term:skip-covered", "{posargs}"],
    ["coverage", "html"],
]

[tool.tox.env.bundle]
dependency_groups = ["bundle"]
allowlist_externals = ["./dist/scim2"]
commands = [
    ["pyinstaller", "--clean", "--log-level", "WARN", "scim2.spec"],
    ["./dist/scim2", "--help"],
]
